# Autonomous ticket runner — configuration.
#
# Nothing tuneable lives in the code. The ceilings in particular are limits on
# token throughput, on the superlinear growth of conflict probability with
# in-flight branches, and on morning review bandwidth — not on CPU.
#
# Changing this file changes `config_hash` in state.json, which is how a resumed
# run tells you it is not the run you started.

[run]
# The integration branch is cut from `base_branch` and never writes back to it.
base_branch = "main"
branch_prefix = "integration/run-"
ticket_branch_prefix = "ticket/"
# Local wall-clock time after which no new ticket is dispatched. In-flight
# tickets are allowed to finish.
wall_clock_stop = "07:00"

# The cap that actually binds is tokens per rolling usage window, not CPU and
# not wall-clock. Three concurrent agents therefore do not cost less than one —
# they spend the same budget three times faster. Run-20260818-2244 projected a
# 6.5-hour drain into a 20-hour dispatch window and still died at 23:00, because
# the burst overran a single usage window and every agent hit the cap at once.
#
# Two is the compromise: the night still has far more wall-clock than it needs,
# and the burn is spread across windows rather than piled into one.
[ceilings]
concurrent = 2
opus = 1

# Budgets come from the ticket's size flag. Exceeding one is a stall.
[budgets]
S = 30
M = 60
L = 120

# Model ids handed to `claude -p --model`.
#
# TIER ORDER (cheapest first): haiku → sonnet → opus
#   haiku-4-5:  $1 / $5   per MTok  (input / output)
#   sonnet-5:   $2 / $10  per MTok
#   opus-5:     $5 / $25  per MTok
#
# Counter-intuitive: sonnet-5 ($2) is CHEAPER than sonnet-4-5 or sonnet-4-6
# ($3). Do NOT downgrade to an older version — it costs more, not less.
# Similarly opus-4 was $15/$75 (now retired); opus-5 at $5/$25 is the right
# choice. Always use the latest model in each tier.
#
# model_cap applies to ticket agents only (review and fix are set explicitly
# below). "sonnet" maps opus→sonnet; "haiku" maps both opus and sonnet→haiku.
# Comment out model_cap to restore per-ticket model assignment from the YAML.
[models]
haiku   = "claude-haiku-4-5"
sonnet  = "claude-sonnet-5"
opus    = "claude-opus-5"
# Downgrade ceiling for ticket agents. Tickets marked [H] haiku are not
# affected by this; tickets marked [O] opus are downgraded to sonnet.
# Remove this key to restore original per-ticket model selection.
model_cap = "sonnet"
# Review and auto-fix agents are costed separately from ticket agents.
# Sonnet handles two-axis review reliably and is 2.5x cheaper than opus here.
# Changed from opus-5 → sonnet-5 (saves ~60% per review, runs every ticket).
review  = "claude-sonnet-5"
fix     = "claude-sonnet-5"

[paths]
tickets = "docs/tickets"
runs = "runs"
# Worktrees live beside the repo, not inside it, so pytest never collects one
# worktree's tests from another's rootdir.
worktrees = "../.wt"
claude_md = "CLAUDE.md"
coding_standards = "docs/CODING_STANDARDS.md"
# A small purpose-built fixture database, copied into every worktree. Never the
# real one: an agent that cannot reach the 11,000-row database cannot damage it.
fixture_db = "DATA/fixture/annotations.sqlite"
# The app resolves its database from Working/database/schema.py:DB_PATH, which is
# DATA/db/annotations.sqlite. A fixture copied anywhere else is a fixture nothing
# reads, and every DB-touching test in the worktree would quietly create its own
# empty database instead.
fixture_db_dest = "DATA/db/annotations.sqlite"
# Read-only recording directories, junctioned (mklink /J) into worktrees at
# their path relative to the repo root. Junctions are unaffected by
# `.git/config` symlinks = false.
#
# This is the minimal set, derived from evidence rather than convenience: the
# only real-data path any test file references is
# DATA/derived/channels/M2_aug_concat_fs1/CH0.npy, and it is needed because
# UI/app.py:2279 constructs a ViewerApp at import time — so the ten files that
# import UI.app fail at COLLECTION without it, not at assertion time. 317 MB,
# against 1.3 GB for all of channels/ and 2.3 GB for all of derived/.
#
# ISOLATION TRADEOFF (recorded deliberately, see ORCHESTRATOR_SPEC.md §Isolation):
# an agent can reach and write to this directory. The database stays protected —
# it is copied, and the copy holds no annotations — but the signal data does not.
# Accepted because everything under derived/ is regenerable from raw/ plus code,
# and because M2_aug_concat_fs1 is a held-out-safe recording (M4 is the locked
# one). The deletion path is covered by the teardown-junction test.
recordings = ["DATA/derived/channels/M2_aug_concat_fs1"]

[agent]
# A list, so a test harness can substitute a stand-in binary.
cli = ["claude"]
# `claude -p` with permissions bypassed: the agent sees one worktree and one
# ticket, and the worktree is disposable.
extra_args = ["--dangerously-skip-permissions"]
# No *new* commit for this long and the agent is killed, independent of budget.
# Measured in commits rather than in output because both failures it catches talk
# happily: a CLI looping on a config parse error produces nothing but noise, and
# an agent that has finished and hung produced everything asked of it. Killing is
# not a verdict — whatever was committed still goes to the gates. In
# run-20260817-2050 this was configured and never implemented, so T35 committed
# its work in twelve minutes, hung for forty-eight, and was thrown away twice.
stall_minutes = 20
# Ask the CLI for a structured session so the run can be costed. This is what
# implements the `tokens` column ORCHESTRATOR_SPEC.md has specified since the
# design settled and five runs shipped without: with `text`, the transcript is
# the final message and nothing else, which is why every model-tier decision in
# [models] below was taken against no measurement at all.
#
# `stream-json` rather than `json`: it emits one line per turn, so an agent that
# is killed still leaves a transcript. Under `json` a killed agent leaves an
# empty file — the defect FOLLOWUPS.md records as [open] after T35's 69 bytes.
# The prose transcript is reconstructed from the stream, so `transcript-N.log`
# still reads as prose and the review gate still finds its findings block; the
# raw stream is kept beside it as `transcript-N.jsonl`.
output_format = "stream-json"
# A hard per-agent ceiling enforced by the CLI itself. 0 disables it. Set this
# once a few runs have been costed and the real per-ticket figure is known —
# guessing a ceiling before measuring just kills tickets mid-flight.
max_budget_usd = 0.0
# The CLI rewrites a global `~/.claude.json` at startup. Agents launched in the
# same instant race on it — in run-20260817-2050 all three started at 20:56:35,
# two read the file mid-write, and both burned a full 60-minute budget printing
# `JSON Parse error: Unexpected EOF`. The worktrees are isolated; that file is
# not. Five seconds is generous against a sub-second write window.
launch_stagger_seconds = 5

[suite]
# Never `-n`. tests/_session_isolation.py documents exactly why parallel
# collection breaks this suite.
command = ["pytest", "-q", "--tb=no"]
timeout_minutes = 25

[retries]
# Infrastructure failures do not count against the ticket.
infrastructure = 3
infrastructure_backoff_seconds = 30
# A stall gets one retry from a clean worktree with the transcript tail injected.
stall = 1

[review]
skill = "code-review"
# Agent-fixes-reviewer-objects is a classic overnight burn. Two rounds, then
# quarantine.
max_rounds = 2
# Blockers stop a merge; majors and minors merge and land in FOLLOWUPS.md.
blocking_severities = ["blocker"]
followups_file = "FOLLOWUPS.md"
timeout_minutes = 30
# A finding that cites no rule number cannot block a merge at 3am.
default_severity = "minor"

[overlap]
# Include module-private (`_`-prefixed) top-level names in the collision check.
# True is faithful to the spec and to standards rule 6.4: two agents both
# writing `_resample_and_znorm` are two implementations of one idea, and being
# private makes that harder to spot rather than less real. Set false if private
# helper collisions prove to be noise. Dunders are always excluded.
include_private = true
# Path prefixes whose symbols do not participate. Test files are leaves —
# nothing imports them, so their top-level names are file-local rather than
# shared vocabulary — and this repo ends 41 of its 42 test files with an
# identical module-private `_run_all()`. In run-20260818-0554 that convention
# read as a collision: T35 merged first and took the name, and T13 was held for
# writing the same boilerplate in a different file, having passed every other
# gate. The gate is for two implementations of one idea, not two copies of one
# footer.
ignore_paths = ["tests/"]

[circuit_breaker]
consecutive_quarantines = 3
quarantine_fraction = 0.4
# A FLAKY mark is a finding, not a shrug: it counts at half weight, so a suite
# that has become broadly unreliable still halts the run.
flaky_weight = 0.5

[rate_limit]
# Handled fleet-wide, not per-agent. Three agents each retrying independently
# into a closed door is 60 requests a minute — see claude-retry.log.
concurrent_signature = 2
fast_exit_seconds = 60
initial_backoff_seconds = 60
# Bounds the *blind* exponential backoff, where nothing told us how long to
# wait. It stays small on purpose.
max_backoff_seconds = 900
# Bounds a wait the transcript explicitly asked for. `You're out of extra usage
# · resets 3:30am` is not a rate limit that clears in seconds; it is a plan
# usage window, and the reset is hours away. Fifteen minutes against that
# guarantees the runner gives up long before the environment recovers — which
# is exactly what run-20260818-2244 did, four times, before the breaker tripped.
# Six hours covers the longest window and still cannot outlast a night.
max_usage_wait_seconds = 21600
# Waking at the exact second the window is said to reopen races the reset.
usage_reset_grace_seconds = 120
