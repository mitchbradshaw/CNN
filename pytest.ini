[pytest]
testpaths = tests

markers =
    ui: drives a real browser against a real Panel server (tests/ui). Slow,
        needs pytest-playwright and a chromium binary. Excluded from the
        default run; see docs/UI_VERIFICATION.md.

# tests/test_analysis_modules.py is a standalone diagnostic script, not a pytest
# module. Its `test_*` functions take positional arguments (`mod`, `results`) and
# are called by `run_all()`; pytest collects them by name and then errors with
# "fixture 'mod' not found". Six collection errors, no real failure.
#
# Run it directly instead:  python tests/test_analysis_modules.py
#
# `-m "not ui"` keeps the default `pytest` run at the wall-clock it has always
# had. The browser suite is a real gate, but it is a SEPARATE one: it boots a
# Panel server and a chromium per test, so folding it into the six-minute
# headless run would roughly double it and make the fast feedback loop that
# CLAUDE.md recommends ("run just tests/test_<module>.py first") useless. A
# later `-m` on the command line overrides this one, so `pytest -m ui` runs the
# browser suite and nothing else.
addopts = --ignore=tests/test_analysis_modules.py -m "not ui"
